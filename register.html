<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — SD Coin</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script defer src="app.js"></script></head>
<body><header class="topbar"><a class="brand" href="index.html">◈ SD COIN</a><nav><a href="login.html">Login</a></nav></header>
<main class="auth-wrap"><form id="register-form" class="panel"><span class="eyebrow">JOIN SD COIN</span><h1>Create account</h1><label>Display name<input name="name" required minlength="2" maxlength="60" autocomplete="name" placeholder="Your name"></label><label>Preferred User ID<input name="user_id" required minlength="6" maxlength="32" pattern="[A-Za-z0-9_-]+" autocomplete="username" placeholder="syedusman608"></label><label>Email<input name="email" type="email" required maxlength="254" autocomplete="email" placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" placeholder="At least 12 characters"></label><button class="button primary full" type="submit">Create wallet</button><p id="form-message" class="message" role="status"></p><p class="muted center">Already registered? <a href="login.html">Sign in</a></p></form></main></body></html>
